name: ManuallyBuildDoc

on: [workflow_dispatch]

# Why this is shaped the way it is:
#
# `julia-actions/julia-docdeploy@v1` (current version) embeds the user-supplied
# `prefix` as a single shell word in a bash array, then runs
# `julia_cmd=( "$prefix" "${julia_cmd[@]}" )`. As a result, the inner
# double-quotes of `xvfb-run -s "-screen 0 1024x768x24"` are never
# re-evaluated: the literal `"-screen 0 1024x768x24"` string reaches
# `xvfb-run` as a single argument and `Xvfb` rejects it with
# `unrecognized option`. The action's README only documents `prefix:
# xvfb-run` (no flags), so we cannot pass `-s "..."` through `prefix`.
#
# The workaround: split the install into our own step (wrapping `julia` in
# `xvfb-run -a -s "-screen 0 1024x768x24"` ourselves), and let the action
# skip its own install step with `install-package: false`. Then start Xvfb
# manually as a background daemon so it is still alive when the build step
# runs `julia docs/make.jl` (which `@repl`s `using AstroPlot` and therefore
# loads GLMakie).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Install GLMakie system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          xorg-dev mesa-utils xvfb libgl1 freeglut3-dev
          libxrandr-dev libxinerama-dev libxcursor-dev
          libxi-dev libxext-dev

      # Start a persistent Xvfb server on display :99. Capture its PID so
      # we can stop it in the cleanup step. `nohup … &` detaches so this
      # step returns immediately; subsequent steps inherit `DISPLAY=:99`.
      - name: Start virtual X server
        run: |
          set -e
          sudo Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset &
          Xvfb_PID=$!
          # Give Xvfb a moment to bind the display
          sleep 2
          if ! kill -0 "$Xvfb_PID" 2>/dev/null; then
            echo "Xvfb failed to start" >&2
            exit 1
          fi
          echo "Xvfb_PID=$Xvfb_PID" >> "$GITHUB_ENV"

      - name: Install package into docs environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPLAY: ":99"
        run: >
          julia --color=yes --project=docs/ -e '
            using Pkg;
            Pkg.develop(PackageSpec(path=pwd()));
            Pkg.instantiate()'

      # Build + deploy. `install-package: false` skips the action's
      # internal install step (already done above). The same `:99`
      # display is forwarded so GLMakie's @repl blocks can render.
      - name: Build and deploy documentation
        uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_VERSION: 0.27.25
          DISPLAY: ":99"
        with:
          install-package: false

      - name: Stop virtual X server
        if: always()
        run: |
          if [ -n "${Xvfb_PID:-}" ]; then
            sudo kill "$Xvfb_PID" 2>/dev/null || true
            sudo kill -9 "$Xvfb_PID" 2>/dev/null || true
          fi